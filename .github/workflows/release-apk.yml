name: Release Android AAB/APK (signed)

# Produces the Play Store upload bundle. Requires these repository secrets:
#   ANDROID_KEYSTORE_BASE64  - base64 of your release .jks keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web and sync Capacitor
        run: |
          npm install
          npm run build
          chmod +x ./scripts/copy-adhan-to-android.sh || true
          ./scripts/copy-adhan-to-android.sh
          npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set — add the release signing secrets first." >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/release.jks

      - name: Build signed bundle and APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adhan-zen-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f android/release.jks
