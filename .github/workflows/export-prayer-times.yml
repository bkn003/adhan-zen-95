name: Export Prayer Times to Cloudflare

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  repository_dispatch:
    types: [regenerate-json]
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Validate secrets
        run: |
          missing=""
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then missing="$missing SUPABASE_URL"; fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then missing="$missing SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "${{ secrets.CLOUDFLARE_PROJECT_NAME }}" ]; then missing="$missing CLOUDFLARE_PROJECT_NAME"; fi
          if [ -n "$missing" ]; then
            echo "❌ Missing GitHub Secrets:$missing"
            echo ""
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "Required secrets:"
            echo "  SUPABASE_URL              → Your Supabase project URL"
            echo "  SUPABASE_SERVICE_ROLE_KEY  → From Supabase Dashboard → Settings → API"
            echo "  CLOUDFLARE_API_TOKEN       → From Cloudflare Dashboard → API Tokens"
            echo "  CLOUDFLARE_ACCOUNT_ID      → From Cloudflare Dashboard → Account ID"
            echo "  CLOUDFLARE_PROJECT_NAME    → Your Cloudflare Pages project name"
            exit 1
          fi
          echo "✅ All secrets present"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Generate JSON files
        run: |
          node --input-type=module -e "
          import { createClient } from '@supabase/supabase-js';
          import fs from 'fs';
          import path from 'path';

          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );

          const outDir = path.join(process.cwd(), 'public/prayer_times');

          // Clean and recreate output dir
          if (fs.existsSync(outDir)) {
            fs.rmSync(outDir, { recursive: true, force: true });
          }
          fs.mkdirSync(outDir, { recursive: true });

          (async () => {
            console.log('🔄 Fetching locations...');
            const { data: locations, error: locError } = await supabase
              .from('locations')
              .select('id, mosque_name, district')
              .neq('is_paused', true);

            if (locError) {
              console.error('❌ Error fetching locations:', locError);
              process.exit(1);
            }

            console.log('🔄 Fetching prayer times...');
            const { data: times, error: timesError } = await supabase
              .from('prayer_times')
              .select('*');

            if (timesError) {
              console.error('❌ Error fetching prayer times:', timesError);
              process.exit(1);
            }

            if (!locations || !times) {
              console.error('❌ No data found');
              process.exit(1);
            }

            console.log(\`📊 Processing \${locations.length} locations and \${times.length} prayer time entries...\`);

            for (const loc of locations) {
              const locationSlug = loc.mosque_name
                .toLowerCase()
                .replace(/[^a-z0-9\\s]/g, '')
                .trim()
                .replace(/\\s+/g, '-');

              const locDir = path.join(outDir, locationSlug);
              fs.mkdirSync(locDir, { recursive: true });

              // Group by month column
              const grouped = {};
              for (const t of times.filter(x => x.location_id === loc.id)) {
                const month = t.month || 'unknown';
                if (!grouped[month]) grouped[month] = [];

                const staticEntry = {
                  date_range: t.date_range,
                  month: t.month,
                  fajr_adhan: t.fajr_adhan,
                  fajr_iqamah: t.fajr_iqamah,
                  dhuhr_adhan: t.dhuhr_adhan,
                  dhuhr_iqamah: t.dhuhr_iqamah,
                  asr_adhan: t.asr_adhan,
                  asr_iqamah: t.asr_iqamah,
                  maghrib_adhan: t.maghrib_adhan,
                  maghrib_iqamah: t.maghrib_iqamah,
                  isha_adhan: t.isha_adhan,
                  isha_iqamah: t.isha_iqamah,
                  jummah_adhan: t.jummah_adhan,
                  jummah_iqamah: t.jummah_iqamah,
                  sun_rise: t.sun_rise,
                  sun_set: t.sun_set,
                  mid_noon: t.mid_noon,
                  sahar_end: t.sahar_end,
                  tharaweeh: t.tharaweeh,
                  isha_ramadan_iqamah: t.isha_ramadan_iqamah,
                  fajr_ramadan_iqamah: t.fajr_ramadan_iqamah,
                  maghrib_ramadan_adhan: t.maghrib_ramadan_adhan,
                  maghrib_ramadan_iqamah: t.maghrib_ramadan_iqamah,
                  ifthar_time: t.ifthar_time || t.iftar_time,
                  location: loc.mosque_name,
                };
                grouped[month].push(staticEntry);
              }

              for (const [month, arr] of Object.entries(grouped)) {
                const filePath = path.join(locDir, \`\${month.toLowerCase()}.json\`);
                fs.writeFileSync(filePath, JSON.stringify(arr, null, 2));
                console.log(\`✅ Written \${filePath} with \${arr.length} entries\`);
              }

              console.log(\`📁 Completed location: \${loc.mosque_name} (\${locationSlug})\`);
            }

            console.log('🎉 Export completed successfully!');
          })();
          "

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/prayer_times/
          git diff --staged --quiet || git commit -m "🕐 Auto-export prayer times from Supabase - $(date)"
          git push

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: ./public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}